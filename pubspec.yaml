name: quran_comprehensive
description: A professional, offline-first Flutter Quran application built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & Navigation
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0
  
  # Database & Storage (Strictly sqflite, no Hive/ObjectBox)
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2
  
  # UI & Utilities
  intl: ^0.19.0
  collection: ^1.18.0
  google_fonts: ^6.1.0 # For UI typography (not for Quranic text)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true # Required for ARB localization
  
  assets:
    - assets/databases/
    - assets/quran/metadata/
    - assets/mushaf/pages/
    - assets/licenses/

  fonts:
    # Note: The actual Uthmani font file must be added in Phase 4/24
    - family: Uthmani
      fonts:
        - asset: assets/fonts/UthmanTN_v2-0.ttf